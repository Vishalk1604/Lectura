<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Lectura class simulator</title>
<style>
  html, body { margin: 0; height: 100%; background: #202124; overflow: hidden;
               font-family: "Segoe UI", Arial, sans-serif; }
  #tile { position: absolute; left: 16px; top: 16px; right: 360px; bottom: 90px;
          background: #000; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; width: 1280px; height: 720px; background: #fff;
           transform-origin: center center; overflow: hidden; flex: none; }
  .layer { position: absolute; inset: 0; background: #fff; transition: opacity 1.5s linear; }
  .slide h1 { margin: 70px 70px 40px; font-size: 54px; color: #1d2340; }
  .slide ul { margin: 0 70px; font-size: 38px; color: #2c3150; line-height: 1.7; }
  .slide li { visibility: hidden; }
  .slide li.on { visibility: visible; }
  .slide .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 18px; background: #4f46e5; }
  #board { position: absolute; inset: 0; overflow: hidden; background: #fafafa; display: none; }
  #boardCanvas { display: block; }
  #cam { position: absolute; right: 18px; bottom: 26px; width: 220px; height: 150px;
         border-radius: 12px; border: 3px solid #fff; z-index: 5; }
  #pointer { position: absolute; width: 14px; height: 14px; border-radius: 50%;
             background: #e5484d; z-index: 6; }
  .people { position: absolute; right: 16px; width: 320px; height: 180px; border-radius: 10px; }
  #controls { position: absolute; left: 0; right: 0; bottom: 18px; display: flex;
              justify-content: center; gap: 18px; }
  #controls div { width: 48px; height: 48px; border-radius: 50%; background: #3c4043; }
  #clock { position: absolute; left: 20px; bottom: 30px; color: #e8eaed; font-size: 15px; }
</style>
</head>
<body>
<div id="tile"><div id="stage">
  <div class="layer slide" id="layerA"></div>
  <div class="layer slide" id="layerB" style="opacity:0"></div>
  <div id="board"><canvas id="boardCanvas" width="1280" height="2000"></canvas></div>
  <canvas id="cam" width="220" height="150"></canvas>
  <div id="pointer"></div>
</div></div>
<canvas class="people" id="p1" width="320" height="180" style="top:16px"></canvas>
<canvas class="people" id="p2" width="320" height="180" style="top:212px"></canvas>
<canvas class="people" id="p3" width="320" height="180" style="top:408px"></canvas>
<div id="controls"><div></div><div></div><div></div><div></div><div></div></div>
<div id="clock">sim</div>
<script>
const SLIDES = {
  1: ["Sorting algorithms", ["Bubble sort compares neighbours", "Insertion sort builds a prefix",
                             "Merge sort divides and merges"]],
  2: ["Complexity", ["Best, average and worst case", "Big-O hides constant factors"]],
  3: ["Divide and conquer", ["Split the problem", "Solve the parts recursively",
                             "Combine the answers"]],
  4: ["Summary", ["Practice problems on page 42", "Quiz next week"]],
};
const state = { phase: "waiting", expected: 7, t0: 0 };
window.simState = state;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const $ = id => document.getElementById(id);

function fit() {
  const tile = $("tile"), st = $("stage");
  const s = Math.min(tile.clientWidth / 1280, tile.clientHeight / 720);
  st.style.transform = `scale(${s})`;
}
window.addEventListener("resize", fit); fit();

function renderSlide(layer, n, shown) {
  const [title, items] = SLIDES[n];
  layer.innerHTML = `<h1>${title}</h1><ul>` +
    items.map((t, i) => `<li class="${i < shown ? "on" : ""}">${t}</li>`).join("") +
    `</ul><div class="bar"></div>`;
}
function showSlide(n, shown) {
  $("board").style.display = "none";
  $("layerB").style.transition = "none"; $("layerB").style.opacity = 0;
  $("layerA").style.display = "block";
  renderSlide($("layerA"), n, shown);
}
async function fadeTo(n, shown) {
  const B = $("layerB");
  renderSlide(B, n, shown);
  B.style.transition = "opacity 1.5s linear";
  B.style.opacity = 1;
  await sleep(1600);
  renderSlide($("layerA"), n, shown);
  B.style.transition = "none"; B.style.opacity = 0;
}

// ---- whiteboard
const bc = $("boardCanvas"), bx = bc.getContext("2d");
let rng = 12345;
const rand = () => (rng = (rng * 1103515245 + 12345) % 2147483648) / 2147483648;
function strokePoints(i, top) {
  const row = Math.floor(i / 6), col = i % 6;
  const x0 = 60 + col * 190, y0 = top + 70 + row * 90;
  const pts = [[x0, y0]];
  for (let k = 0; k < 12; k++) {
    const [px] = pts[pts.length - 1];
    pts.push([px + 5 + rand() * 10, y0 - 25 + rand() * 50]);
  }
  return pts;
}
async function writeStroke(pts, color = "#1a237e", width = 4) {
  bx.strokeStyle = color; bx.lineWidth = width; bx.lineCap = "round"; bx.lineJoin = "round";
  for (let k = 1; k < pts.length; k++) {
    bx.beginPath(); bx.moveTo(...pts[k - 1]); bx.lineTo(...pts[k]); bx.stroke();
    await sleep(45);
  }
}
function clearBoard() {
  bx.fillStyle = "#fafafa"; bx.fillRect(0, 0, bc.width, bc.height);
  $("board").scrollTop = 0;
}
function showBoard() {
  $("layerA").style.display = "none"; $("layerB").style.opacity = 0;
  $("board").style.display = "block";
}
async function smoothScroll(dy) {
  const b = $("board"), start = b.scrollTop, steps = 12;
  for (let i = 1; i <= steps; i++) { b.scrollTop = start + dy * i / steps; await sleep(50); }
}

// ---- moving things: webcam bubble, pointer, participant tiles
function noiseCanvas(c, t, hue) {
  const g = c.getContext("2d");
  g.fillStyle = `hsl(${hue},25%,35%)`; g.fillRect(0, 0, c.width, c.height);
  for (let i = 0; i < 40; i++) {
    g.fillStyle = `hsla(${hue + Math.random() * 40},30%,${30 + Math.random() * 40}%,0.6)`;
    g.fillRect(Math.random() * c.width, Math.random() * c.height, 30, 30);
  }
  g.fillStyle = "#d9a37f";
  g.beginPath();
  g.arc(c.width / 2 + 25 * Math.sin(t / 300), c.height / 2 + 8 * Math.cos(t / 450), 38, 0, 7);
  g.fill();
}
function animate(t) {
  noiseCanvas($("cam"), t, 210);
  noiseCanvas($("p1"), t, 20); noiseCanvas($("p2"), t + 900, 120); noiseCanvas($("p3"), t + 400, 300);
  const p = $("pointer");
  p.style.left = (600 + 260 * Math.sin(t / 2100)) + "px";
  p.style.top = (420 + 120 * Math.cos(t / 1700)) + "px";
  $("clock").textContent = state.phase;
  const title = `Lectura class simulator - ${state.phase}`;
  if (document.title !== title) document.title = title;   // lets the test script follow along
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// ---- the class timeline (about 90 s)
async function run() {
  // blank screen while the recorder starts
  $("layerA").innerHTML = ""; state.phase = "waiting";
  await sleep(8000);
  state.t0 = performance.now();
  state.phase = "slide1";
  for (let b = 1; b <= 3; b++) { showSlide(1, b); await sleep(3500); }   // bullet build
  await sleep(2000);
  state.phase = "slide2";
  for (let b = 1; b <= 2; b++) { showSlide(2, b); await sleep(3500); }
  await sleep(1500);
  state.phase = "fade to slide3";
  await fadeTo(3, 3);
  await sleep(6000);
  state.phase = "revisit slide1";
  showSlide(1, 3);                                                         // revisit -> deduped
  await sleep(5000);

  state.phase = "board page 1";
  clearBoard(); showBoard();
  const page1 = [];
  for (let i = 0; i < 18; i++) {
    const pts = strokePoints(i, 0); page1.push(pts);
    await writeStroke(pts);
    if (i % 6 === 5) await sleep(2500);                                    // teacher pauses
  }
  state.phase = "small erase";
  await writeStroke(page1[7], "#fafafa", 14);                              // rub out one word
  await sleep(3000);
  for (let i = 18; i < 22; i++) await writeStroke(strokePoints(i, 0));
  await sleep(4000);

  state.phase = "board page 2";
  clearBoard();                                                            // new blank page
  await sleep(1500);
  for (let i = 0; i < 30; i++) {
    await writeStroke(strokePoints(i, 0));
    if (i % 10 === 9) await sleep(2000);
  }
  await sleep(3000);
  state.phase = "scroll";
  await smoothScroll(500);                                                 // hides most writing
  await sleep(2500);
  for (let i = 0; i < 12; i++) await writeStroke(strokePoints(i, 720));
  await sleep(4000);

  state.phase = "slide4";
  showSlide(4, 2);
  await sleep(6000);
  state.phase = "done";
}
run();
</script>
</body>
</html>
